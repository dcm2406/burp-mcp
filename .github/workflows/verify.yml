name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gradle test and fatJar (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon clean test fatJar

      - name: Gradle test and fatJar (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean test fatJar

      - name: Verify packaging invariants (POSIX only)
        if: runner.os == 'Linux'
        run: ./scripts/ci-checks.sh

      - name: MCP server build, type-check and tests
        run: |
          cd mcp-server
          npm ci
          npm test
        shell: bash
