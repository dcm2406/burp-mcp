name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gradle: test + fatJar
        run: ./gradlew --no-daemon clean test fatJar
        shell: bash

      - name: Verify packaging invariants
        run: ./scripts/ci-checks.sh
        shell: bash

      - name: MCP server: build, type-check, tests
        run: |
          cd mcp-server
          npm ci
          npm test
        shell: bash
